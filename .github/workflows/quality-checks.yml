# GTM-CI-01: documentation and presentation quality gates.
# Validation only: nothing is uploaded, published or deployed. See docs/CI.md.
name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token for every job. No secrets are used.
permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Documentation (Zensical strict build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install pinned documentation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-docs.txt
          zensical --version

      - name: Strict build (fails on broken links or anchors)
        run: zensical build --clean --strict

      - name: Check excluded internal documents are not published
        run: python scripts/ci/check_docs_site.py

      - name: Confirm tracked files are unchanged
        run: git diff --exit-code

  presentation:
    name: Presentation (Marp CLI 4.5.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Validate deck, theme, SVG references and render smoke test
        run: node scripts/ci/check_presentation.mjs --render

      - name: Confirm sources and committed exports are unchanged
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
